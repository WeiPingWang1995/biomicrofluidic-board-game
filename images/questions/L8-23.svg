<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Helvetica,Arial,sans-serif"><rect width="640" height="300" rx="10" fill="#113842"/><text x="320" y="36" font-size="18" font-weight="700" fill="#eef6f4" text-anchor="middle">Folding makes thinner layers (multi-lamination)</text><rect x="40" y="70.0" width="150" height="65.0" fill="#7bd8ef"/><rect x="40" y="135.0" width="150" height="65.0" fill="#ffb25c"/><text x="115" y="226" font-size="15" fill="#eef6f4" text-anchor="middle">2 layers</text><rect x="245" y="70.0" width="150" height="32.5" fill="#7bd8ef"/><rect x="245" y="102.5" width="150" height="32.5" fill="#ffb25c"/><rect x="245" y="135.0" width="150" height="32.5" fill="#7bd8ef"/><rect x="245" y="167.5" width="150" height="32.5" fill="#ffb25c"/><text x="320" y="226" font-size="15" fill="#eef6f4" text-anchor="middle">4 layers</text><rect x="450" y="70.0" width="150" height="16.2" fill="#7bd8ef"/><rect x="450" y="86.2" width="150" height="16.2" fill="#ffb25c"/><rect x="450" y="102.5" width="150" height="16.2" fill="#7bd8ef"/><rect x="450" y="118.8" width="150" height="16.2" fill="#ffb25c"/><rect x="450" y="135.0" width="150" height="16.2" fill="#7bd8ef"/><rect x="450" y="151.2" width="150" height="16.2" fill="#ffb25c"/><rect x="450" y="167.5" width="150" height="16.2" fill="#7bd8ef"/><rect x="450" y="183.8" width="150" height="16.2" fill="#ffb25c"/><text x="525" y="226" font-size="15" fill="#eef6f4" text-anchor="middle">8 layers</text><path d="M200 135 H226" stroke="#d9b45b" stroke-width="4"/><path d="M226 125 L242 135 L226 145 Z" fill="#d9b45b"/><path d="M405 135 H431" stroke="#d9b45b" stroke-width="4"/><path d="M431 125 L447 135 L431 145 Z" fill="#d9b45b"/><text x="320" y="268" font-size="16" fill="#eef6f4" text-anchor="middle">Thinner layers mean a shorter diffusion distance, so mixing is faster</text></svg>
